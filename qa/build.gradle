plugins {
    id 'fabric-loom' version '1.9.2'
}
version = '1.0.0'
group = 'com.pixelclub.teams.qa'
base.archivesName = 'justteams-runtime-qa'
repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.0'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.0+1.21.1'
    compileOnly files('F:/Pixelclub/justteams-fabric-pxc/build/classes/java/main')
    compileOnly files('F:/Pixelclub/justteams-fabric-pxc/libs/Impactor-Fabric-5.3.5+1.21.1.jar')
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
